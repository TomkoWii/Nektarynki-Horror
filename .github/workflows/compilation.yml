name: Wii Game Compilation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check Wii libraries
        run: |
          echo "Checking libogc..."
          ls /opt/devkitpro/libogc/include/ogc/system.h

      - name: Compile Wii game
        run: make -f Makefile

      - name: Upload Wii game
        uses: actions/upload-artifact@v4
        with:
          name: Nektarynki-Wii
          path: Nektarynki.dol
          if-no-files-found: error
